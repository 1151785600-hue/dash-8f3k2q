<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>API 用量看板</title>
<style>
:root{
  --bg:#0e1117; --card:#161b26; --line:#232b3a; --fg:#e6edf7; --dim:#8b98ad;
  --ok:#2ecc71; --warn:#f1c40f; --bad:#ff5c5c; --accent:#4c8dff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:14px 14px 40px;background:var(--bg);color:var(--fg);
     font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;}
h1{font-size:19px;margin:2px 0 10px;font-weight:600}
.sub{color:var(--dim);font-size:12px;margin-bottom:14px}
.tot{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px}
.tot .big{font-size:28px;font-weight:700;letter-spacing:-.5px}
.tot .row{display:flex;justify-content:space-between;align-items:baseline}
.bar{height:8px;border-radius:99px;background:#222a38;overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--ok);transition:width .4s}
.grid{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.card .hd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.dot.warn{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.dot.bad{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.dot.idle{background:#4a5568}
.card .nm{font-weight:600;flex:1;font-size:15px}
.tag{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.amt{font-size:26px;font-weight:700;letter-spacing:-.5px}
.amt small{font-size:13px;font-weight:400;color:var(--dim);margin-left:3px}
.det{color:var(--dim);font-size:12px;margin-top:4px;min-height:16px;word-break:break-all}
.spend{color:var(--dim);font-size:12px;margin-top:10px}
.spend b{color:var(--fg);font-weight:600}
.acts{display:flex;gap:8px;margin-top:12px}
a.btn{flex:1;text-align:center;text-decoration:none;font-size:13px;padding:9px 0;border-radius:10px;
      border:1px solid var(--line);color:var(--fg);background:#1d2431}
a.btn.p{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
a.btn:active{opacity:.75}
.foot{color:var(--dim);font-size:11px;margin-top:18px;text-align:center;line-height:1.8}
.alarm{background:#2a1518;border:1px solid #5a2a2f;border-radius:12px;padding:11px 13px;margin-bottom:14px}
.alarm .t{color:#ff8a8a;font-size:12px;font-weight:600;margin-bottom:5px}
.alarm li{color:#ffc9c9;font-size:12.5px;margin:2px 0}
.deals{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:16px}
.deals .dh{font-size:14px;font-weight:600;margin-bottom:4px}
.deals .dh span{color:var(--dim);font-size:11px;font-weight:400;margin-left:6px}
.deals .more{float:right;font-size:11px;color:var(--accent);text-decoration:none;font-weight:400}
.deals .it{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.deals .it:first-of-type{border-top:0}
.deals .tx{flex:1;min-width:0}
.deals .tt{font-size:13px;line-height:1.4}
.deals .vd{color:var(--dim);font-size:11px;margin-top:2px;line-height:1.5}
.deals .go{flex:0 0 auto;font-size:12px;color:var(--accent);text-decoration:none;padding-top:1px}
.deals .tag{display:inline-block;font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:99px;padding:0 6px;margin-left:4px}
</style>
</head>
<body>
<h1>API 用量看板</h1>
<div class="sub" id="ts">加载中…</div>

<div class="tot">
  <div class="row">
    <div><div class="sub" style="margin:0">本月合计花费</div>
      <div class="big" id="total">—</div></div>
    <div style="text-align:right"><div class="sub" style="margin:0">预算</div>
      <div class="big" style="font-size:18px" id="budget">—</div></div>
  </div>
  <div class="bar"><i id="tbar" style="width:0"></i></div>
  <div class="sub" id="calls" style="margin:8px 0 0"></div>
</div>

<div id="alerts"></div>
<div id="promos"></div>

<div class="grid" id="grid"></div>

<div class="foot" id="foot"></div>

<script src="data.js"></script>
<script>
function pct(v,b){ if(!b) return 0; return Math.min(100, Math.round(v/b*100)); }
function cls(p){ return p>=90?'bad':(p>=70?'warn':'ok'); }
function money(v){ if(v===null||v===undefined) return null;
  return (Math.round(v*100)/100).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function esc(s){ return String(s===null||s===undefined?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

function tk(n){
  if(n===null||n===undefined||isNaN(n)) return '—';
  n=Number(n);
  if(n>=1e8) return (n/1e8).toFixed(2)+' 亿';
  if(n>=1e4) return (n/1e4).toFixed(1)+' 万';
  return n.toLocaleString();
}

function render(D){
  document.getElementById('ts').textContent = '数据更新于 ' + (D.generated_at||'—');
  const t = D.totals||{};
  document.getElementById('total').innerHTML = money(t.spent_month) + '<small>元</small>';
  document.getElementById('budget').textContent = money(t.budget_month) + ' 元';
  const tb = document.getElementById('tbar');
  tb.style.width = pct(t.spent_month, t.budget_month) + '%';
  tb.style.background = getComputedStyle(document.documentElement).getPropertyValue('--'+cls(t.pct));
  document.getElementById('calls').textContent =
    (D.ledger? D.ledger.calls : 0) + ' 次调用记录 · 统计月份 ' + (D.ledger? D.ledger.month : '');

  const ab = document.getElementById('alerts');
  if(D.alerts && D.alerts.length){
    ab.innerHTML = '<div class="alarm"><div class="t">需要留意</div><ul>'+
      D.alerts.map(function(a){return '<li>· '+a+'</li>';}).join('')+'</ul></div>';
  } else { ab.innerHTML=''; }

  const pb = document.getElementById('promos');
  const pr = D.promos || {};
  if(pr.items && pr.items.length){
    pb.innerHTML = '<div class="deals"><div class="dh">免费额度与优惠<span>共 '+
      pr.items.length+' 条 · 更新 '+esc(String(pr.updated_at||'').slice(0,10))+
      '</span><a class="more" href="https://buguoshixc.github.io/ai-deals-aggregator/" target="_blank" rel="noopener">全部 →</a></div>'+
      pr.items.slice(0,5).map(function(x){
        return '<div class="it"><div class="tx"><div class="tt">'+esc(x.title)+
          '<span class="tag">'+esc(x.claim)+'</span></div><div class="vd">'+esc(x.vendor)+
          ' · '+esc(x.desc)+' · '+esc(x.expiry)+'</div></div>'+
          '<a class="go" href="'+esc(x.url)+'" target="_blank" rel="noopener">详情 →</a></div>';
      }).join('')+'</div>';
  } else { pb.innerHTML=''; }

  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  (D.platforms||[]).forEach(function(c){
    const sp = c.spent_month||0, bd = c.budget||0;
    const p = pct(sp,bd);
    let dot='idle', amt='—', det=[];
    if(c.kind==='token_quota'){
      if(c.remain_tokens!==null && c.remain_tokens!==undefined){
        var _u = c.unit || 'tokens';
        dot='ok'; amt=tk(c.remain_tokens) + '<small>' + _u + ' 剩余</small>';
        if(c.total_tokens) det.push('套餐总量 ' + tk(c.total_tokens) + ' ' + _u);
        if(c.used_tokens!==null && c.used_tokens!==undefined) det.push('已用 ' + tk(c.used_tokens) + ' ' + _u);
        if(c.used_pct!==null && c.used_pct!==undefined){
          det.push('已用 ' + c.used_pct + '%');
          if(c.used_pct>=85) dot='bad'; else if(c.used_pct>=70) dot='warn';
        }
      } else if(c.status==='pending_credentials'){
        dot='idle'; amt='待接入'; det.push(c.problem||'等待凭据');
      } else if(c.status==='ok'){
        dot='ok'; amt='可用'; det.push(c.usage_note||'探针正常');
      } else if(c.status==='exhausted'){
        dot='bad'; amt='额度耗尽'; det.push(c.usage_note||'调用被拒绝');
      } else {
        dot='bad'; amt='读取失败'; det.push(c.problem||c.note||'接口异常');
      }
    } else if(c.kind==='usage'){
      dot='ok'; amt='$' + money(c.used_usd) + '<small>已用</small>';
      if(c.usage_note) det.push(c.usage_note);
    } else if(c.balance!==null && c.balance!==undefined && c.kind==='quota'){
      dot='ok'; amt=(c.quota_models||0) + '<small>个模型配额</small>';
      (c.picked||[]).forEach(function(x){ det.push(x.model+'：'+(x.usage_limit||'—')+' '+(x.unit||'')); });
      det.push('账户余额 ' + money(c.balance) + ' 元');
    } else if(c.balance!==null && c.balance!==undefined){
      var unit = (c.currency && c.currency!=='CNY') ? c.currency : '元';
      amt = (unit==='USD' ? '$' : '') + money(c.balance) + '<small>' + unit + '</small>';
      dot = 'ok';
      if(c.voucher!==null && c.voucher!==undefined && c.voucher>0) det.push('代金券 ' + money(c.voucher) + ' 元');
      if(c.cash!==null && c.cash!==undefined && c.cash>0) det.push('现金 ' + money(c.cash) + ' 元');
      if(c.balance<0) dot='bad';
      else if(c.balance===0) dot='warn';
      else if(c.balance<=10) dot='bad';
      else if(c.balance<=30) dot='warn';
    } else if(c.status==='pending_credentials'){
      dot='idle'; amt='待接入'; det.push(c.problem||'等待凭据');
    } else if(c.kind==='quota'){
      dot='ok'; amt=(c.quota_models||0) + '<small>个模型配额</small>';
      (c.picked||[]).forEach(function(x){ det.push(x.model+'：'+(x.usage_limit||'—')+' '+(x.unit||'')); });
    } else {
      dot='idle'; amt='无官方接口';
      if(c.problem) det.push(c.problem);
    }
    if(c.stale){ dot='warn'; }
    if(c.probe && c.probe!=='ok'){ if(dot==='ok') dot='warn'; det.push('探活 '+c.probe); }
    if(c.usage_note) det.push(c.usage_note);
    else if(c.tokens_7d!==null && c.tokens_7d!==undefined) det.push('近 7 天 token ' + c.tokens_7d.toLocaleString());
    if(c.note) det.push(c.note);

    const el = document.createElement('div');
    el.className='card';
    el.innerHTML =
      '<div class="hd"><span class="dot '+dot+'"></span><span class="nm">'+c.name+'</span>'+
      '<span class="tag">'+(c.kind==='balance'?'余额':(c.kind==='quota'?'配额':(c.kind==='token_quota'?'套餐':'自记账')))+'</span></div>'+
      '<div class="amt">'+amt+'</div>'+
      '<div class="det">'+det.join(' · ')+'</div>'+
      (c.kind==='token_quota'
        ? '<div class="spend">套餐内调用，不按次计费</div>'
        : '<div class="spend">本月花费（按单价估算）<b>'+money(sp)+'</b> 元 / 预算 '+money(bd)+' 元'+
          (bd? '（'+p+'%）':'')+'</div>')+
      (bd? '<div class="bar" style="margin-top:6px"><i style="width:'+p+'%;background:var(--'+cls(p)+')"></i></div>':'')+
      '<div class="acts">'+
        (c.links&&c.links.recharge?'<a class="btn p" href="'+c.links.recharge+'" target="_blank" rel="noopener">去充值</a>':'')+
        (c.links&&c.links.console?'<a class="btn" href="'+c.links.console+'" target="_blank" rel="noopener">控制台</a>':'')+
      '</div>';
    grid.appendChild(el);
  });
  document.getElementById('foot').innerHTML =
    '数据源：官方 API（Kimi/阶跃/百炼）+ 云厂商账单（火山/阿里云）+ 本地记账<br>' +
    '额度告警通过 Server酱 推送至微信 · 此页可添加到手机主屏幕';
}
fetch('data.json?t=' + Date.now(), {cache:'no-store'})
  .then(function(r){ return r.json(); })
  .then(render)
  .catch(function(){
    if(window.DASH){ render(window.DASH); }
    else{ document.getElementById('ts').textContent = '未找到数据（data.json 缺失）'; }
  });
</script>
</body>
</html>
